<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Decor Joy Gurgaon</title>
  <meta name="theme-color" content="#b88932">
  <style>
    :root {
      --cream: #f8f4ed;
      --gold: #b88932;
      --dark: #172019;
      --text: #333333;
      --text-muted: #666666;
      --white: #ffffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--cream);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: var(--white);
      max-width: 440px;
      width: 100%;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 10px 30px rgba(23, 32, 25, 0.08);
      border: 1px solid #e5d6bd;
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.6rem;
      color: var(--dark);
      margin-bottom: 10px;
      font-weight: 700;
    }
    p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      background-color: var(--gold);
      color: var(--white);
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(184, 137, 50, 0.3);
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      background-color: #8c6424;
      transform: translateY(-2px);
    }
    .contact-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed #e5d6bd;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .contact-box a {
      color: var(--gold);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="offline-card" role="main">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're Offline</h1>
    <p>We couldn't connect to Decor Joy right now. Please check your internet connection or Wi-Fi.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      🔄 Tap to Retry
    </button>
    <div class="contact-box">
      Need urgent celebration decoration?<br>
      Call / WhatsApp us directly at <a href="tel:+917015767715">+91 70157 67715</a>
    </div>
  </main>
  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
