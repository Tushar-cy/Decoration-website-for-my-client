name: CI — Lint, Test, Audit, Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · Audit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node.js setup ─────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ── Install dependencies ───────────────────────────────────────
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      # ── Lint ───────────────────────────────────────────────────────
      - name: Lint client (oxlint)
        run: npm run lint
        working-directory: client

      # ── Security Audit ─────────────────────────────────────────────
      - name: Audit server dependencies (fail on HIGH+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

      - name: Audit client dependencies (fail on HIGH+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: client

      # ── Build Client & Prerender SSR ──────────────────────────────
      - name: Build client
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.STAGING_API_URL || 'https://api.decorjoygurgaon.com' }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY_ID_STAGING }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      # ── Unit Tests ─────────────────────────────────────────────────
      - name: Run server unit tests
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/decorjoy_test
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars_long
          CLIENT_URL: http://localhost:5173
          REDIS_URL: redis://localhost:6379

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: client/dist/
          retention-days: 7
